<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>omokai — 브라우저 오목</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- onnxruntime-web (WASM backend, no install) -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>omokai</h1>
      <p class="subtitle">9×9 오목 · 브라우저에서 학습된 모델과 대국</p>
    </header>

    <section class="controls">
      <label>
        체크포인트
        <select id="checkpoint"></select>
      </label>
      <label>
        내 색
        <select id="player-color">
          <option value="1">흑 (선)</option>
          <option value="-1">백 (후)</option>
        </select>
      </label>
      <label>
        AI 시뮬레이션
        <input type="range" id="sims" min="16" max="800" step="16" value="160" />
        <span id="sims-value">160</span>
      </label>
      <button id="new-game">새 게임</button>
      <button id="undo">한 수 무르기</button>
    </section>

    <section class="game">
      <canvas id="board" width="540" height="540"></canvas>
      <aside class="status">
        <div id="status-line">모델 로딩 중…</div>
        <div class="meta">
          <div>현재 차례: <span id="to-play">-</span></div>
          <div>마지막 수: <span id="last-move">-</span></div>
          <div>AI 평가값: <span id="ai-value">-</span></div>
          <div>탐색 진행: <span id="ai-progress">-</span></div>
        </div>
        <details>
          <summary>체크포인트 정보</summary>
          <pre id="ckpt-info">-</pre>
        </details>
      </aside>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
