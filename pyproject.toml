[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omokai"
version = "0.1.0"
description = "Self-play reinforcement learning Omok agent with GUI checkpoint play support."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.9",
  "numpy>=1.26,<2.0",
  "PyYAML>=6.0",
  "pygame>=2.6",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["omokai*"]
