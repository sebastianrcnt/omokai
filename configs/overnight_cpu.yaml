experiment_name: overnight_cpu
seed: 19
max_hours: 8.0
device: cpu
use_amp: false

rules:
  board_size: 9
  exactly_five: false

network:
  channels: 64
  blocks: 6
  value_hidden: 128
  se_reduction: 8

selfplay:
  games_per_iteration: 24
  batch_size: 6
  temperature_moves: 8
  dirichlet_alpha: 0.22
  dirichlet_epsilon: 0.20
  c_puct: 1.6
  candidate_mix_fraction: 0.5
  mixed_iterations_after_promotion: 8
  simulation_schedule:
    - fraction: 0.0
      simulations: 24
    - fraction: 0.25
      simulations: 48
    - fraction: 0.70
      simulations: 72

optimization:
  batch_size: 64
  updates_per_iteration: 64
  learning_rate: 0.0005
  min_learning_rate: 0.0005
  weight_decay: 0.0001
  grad_clip: 1.0
  replay_capacity: 20000
  warmup_games: 48

arena:
  games: 8
  simulations: 48
  accept_win_rate: 0.55
  min_white_win_rate: 0.25
  bootstrap_games: 4
  bootstrap_simulations: 24
  bootstrap_accept_win_rate: 0.5
  bootstrap_min_white_win_rate: 0.25

checkpoint:
  directory: checkpoints/overnight_cpu
  save_every_iteration: true
